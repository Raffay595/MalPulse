[project]
name = "malpulse"
version = "0.1.0"
description = "MalPulse backend"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.0",
    "flask-cors>=5.0.1",
    "pefile>=2024.8.26",
    "yara-python>=4.5.1",
    "scikit-learn>=1.6.1",
    "pdfminer.six>=20250327",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "joblib>=1.4.2",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "fpdf2>=2.8.2",
    "reportlab>=4.3.1",
    "groq>=0.22.0",
    "langchain>=0.3.23",
    "langchain-groq>=0.3.2",
    "werkzeug>=3.1.3"
]

[tool.vercel]
entrypoint = "backend.app:app"
