[project]
name = "malpulse"
version = "0.1.0"
description = "MalPulse backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "flask>=3.1.0",
    "flask-cors>=5.0.1",
    "werkzeug>=3.1.3",

    # Core analysis libraries
    "olefile>=0.47",
    "pefile>=2024.8.26",
    "yara-python>=4.5.1",
    "pdfplumber>=0.11.6",
    "pdfminer.six>=20250327",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",

    # AI / LLM
    "groq>=0.22.0",
    "langchain>=0.3.23",
    "langchain-core>=0.3.51",
    "langchain-groq>=0.3.2",
    "langchain-text-splitters>=0.3.8",
    "langsmith>=0.3.30",

    # ML
    "scikit-learn>=1.6.1",
    "numpy>=2.2.4",
    "scipy>=1.15.2",
    "joblib>=1.4.2",

    # Data / reporting
    "pandas>=2.2.3",
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
    "reportlab>=4.3.1",
    "fpdf2>=2.8.2",
    "pillow>=11.1.0",

    # Networking / utilities
    "requests>=2.32.3",
    "python-dotenv>=1.1.0",
    "vt-py>=0.20.0",
]
